header:
  version: 14
  includes:
    - boards/radxa-zero-3w.yml

# Same image on Radxa's vendor kernel (hardware video encoder, built-in RKNPU):
#   kas build boards/radxa-zero-3w-vendor.yml
machine: radxa-zero-3w-vendor

local_conf_header:
  vendor-kernel: |
    # RKNPU is built into the vendor kernel, the out-of-tree port is mainline only.
    IMAGE_INSTALL:remove = "rknpu-driver"
    # CSI camera through the Rockchip ISP (camera-service preset, the USB grabber is
    # usb-grabber; switching at runtime: see camera-service.service).
    CAMERA = "csi-imx462"
    # Hardware H.264/H.265 encoder library and its test tools.
    IMAGE_INSTALL:append = " rockchip-mpp rockchip-mpp-tests"
    # Colors, white balance and exposure for the CSI camera through the Rockchip ISP.
    IMAGE_INSTALL:append = " isp-tuning-service"
