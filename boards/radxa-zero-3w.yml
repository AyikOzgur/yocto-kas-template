header:
  version: 14

machine: radxa-zero-3w
target: my-core-image

repos:
  poky:
    url: https://git.yoctoproject.org/git/poky
    path: sources/poky
    branch: scarthgap
    layers:
      meta:
      meta-poky:
      meta-yocto-bsp:

  meta-openembedded:
    url: https://github.com/openembedded/meta-openembedded.git
    path: sources/meta-openembedded
    branch: scarthgap
    layers:
      meta-oe:
      meta-python:
      meta-networking:

  meta-arm:
    url: https://git.yoctoproject.org/meta-arm
    path: sources/meta-arm
    branch: scarthgap
    layers:
      meta-arm:
      meta-arm-toolchain:

  rockcip:
    url: https://git.yoctoproject.org/meta-rockchip
    path: sources/meta-rockchip
    branch: scarthgap

  meta-bsptemplate:
    path: sources/meta-bsptemplate

  meta-distrotemplate:
    path: sources/meta-distrotemplate

local_conf_header:
  base: |
    DL_DIR = "/home/ozgur/yocto-shared/dl"
    SSTATE_DIR = "/home/ozgur/yocto-shared/sstate-cache"
    IMAGE_FEATURES += "debug-tweaks"
    EXTRA_IMAGE_FEATURES += "package-management"
    DISTRO = "mydistro"
    IMAGE_INSTALL:append = " aic8800-driver wpa-supplicant"
    IMAGE_FEATURES += "ssh-server-openssh"
