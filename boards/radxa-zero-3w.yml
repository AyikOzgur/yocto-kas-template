header:
  version: 14

machine: radxa-zero-3w
target: core-image-base

repos:
  poky:
    url: https://git.yoctoproject.org/git/poky
    path: sources/poky
    branch: scarthgap
    layers:
      meta:
      meta-poky:
      meta-yocto-bsp:

  meta-openembedded:
    url: https://github.com/openembedded/meta-openembedded.git
    path: sources/meta-openembedded
    branch: scarthgap
    layers:
      meta-oe:
      meta-python:

  meta-arm:
    url: https://git.yoctoproject.org/meta-arm
    path: sources/meta-arm
    branch: scarthgap
    layers:
      meta-arm:
      meta-arm-toolchain:

  rockcip:
    url: https://git.yoctoproject.org/meta-rockchip
    path: sources/meta-rockchip
    branch: scarthgap

  meta-template:
    path: sources/meta-template

local_conf_header:
  base: |
    DL_DIR = "/home/ozgur/yocto-shared/dl"
    SSTATE_DIR = "/home/ozgur/yocto-shared/sstate-cache"
    IMAGE_FEATURES += "debug-tweaks"
    PACKAGE_CLASSES = "package_rpm"
    EXTRA_IMAGE_FEATURES += "package-management"