# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-bsptemplate"
BBFILE_PATTERN_meta-bsptemplate = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-bsptemplate = "6"

LAYERDEPENDS_meta-bsptemplate = "core rockchip"
LAYERSERIES_COMPAT_meta-bsptemplate = "scarthgap"