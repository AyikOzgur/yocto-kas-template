#@TYPE: Machine
#@DESCRIPTION: Radxa ZERO 3W with Radxa's vendor (Rockchip BSP 6.1) kernel, for the
#@DESCRIPTION: hardware H.264/H.265 encoder. Everything else is radxa-zero-3w.

# Keep radxa-zero-3w overrides and COMPATIBLE_MACHINE matches working.
MACHINEOVERRIDES =. "radxa-zero-3w:"

require conf/machine/radxa-zero-3w.conf

PREFERRED_PROVIDER_virtual/kernel = "linux-radxa"
KERNEL_DEVICETREE = "rockchip/rk3566-radxa-zero-3w-aic8800ds2.dtb"
