require conf/machine/include/radxa-zero-3.inc

# Original BSP default config name was wrong.s
UBOOT_MACHINE = "radxa-zero-3w-rk3566_defconfig"
KERNEL_DEVICETREE = "rockchip/rk3566-radxa-zero-3w.dtb"
WKS_FILE = "rockchip_ab.wks"

# Define the two boot labels
UBOOT_EXTLINUX_LABELS = "slot-a slot-b"
UBOOT_EXTLINUX_DEFAULT_LABEL = "slot-a"
UBOOT_EXTLINUX_TIMEOUT = "30"
UBOOT_EXTLINUX_KERNEL_ARGS = "rootwait ro rootfstype=ext4"
# The kernel mounts each slot through a dm-verity device. U-Boot expands
# ${verity_sectors_*} and ${verity_args_*} from its environment, where the
# image build and SWUpdate store the hash tree parameters of each slot.
# Label A Configuration
UBOOT_EXTLINUX_MENU_DESCRIPTION:slot-a = "slot-a"
UBOOT_EXTLINUX_ROOT:slot-a = 'root=/dev/dm-0 dm-mod.waitfor=/dev/mmcblk1p10 dm-mod.create="rootfs,,,ro,0 ${verity_sectors_a} verity 1 /dev/mmcblk1p10 /dev/mmcblk1p10 ${verity_args_a}"'
UBOOT_EXTLINUX_KERNEL_IMAGE:slot-a  = "/${KERNEL_IMAGETYPE}A"
# Label B Configuration
UBOOT_EXTLINUX_MENU_DESCRIPTION:slot-b = "slot-b"
UBOOT_EXTLINUX_ROOT:slot-b = 'root=/dev/dm-0 dm-mod.waitfor=/dev/mmcblk1p11 dm-mod.create="rootfs,,,ro,0 ${verity_sectors_b} verity 1 /dev/mmcblk1p11 /dev/mmcblk1p11 ${verity_args_b}"'
UBOOT_EXTLINUX_KERNEL_IMAGE:slot-b  = "/${KERNEL_IMAGETYPE}B"

# Deploy fit image and extlinux files to boot partition.
IMAGE_BOOT_FILES = " \
    ${KERNEL_IMAGETYPE}A \
    ${KERNEL_IMAGETYPE}B \
    extlinux.conf;extlinux/extlinux.conf \
"

# Remove boot files from rootfs
MACHINE_ESSENTIAL_EXTRA_RDEPENDS:remove = "u-boot-extlinux kernel-image fitImage kernel-devicetree"