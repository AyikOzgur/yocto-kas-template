require conf/machine/include/radxa-zero-3.inc

# Original BSP default config name was wrong.s
UBOOT_MACHINE = "radxa-zero-3w-rk3566_defconfig"
KERNEL_DEVICETREE = "rockchip/rk3566-radxa-zero-3w.dtb"
WKS_FILE = "rockchip_ab.wks"

# Even if it is called label here, it is partname from wks file.
UBOOT_EXTLINUX_ROOT = "root=PARTLABEL=rootfsA"
UBOOT_EXTLINUX_KERNEL_IMAGE = "/${KERNEL_IMAGETYPE}"
RK_IMAGE_INCLUDES_UBOOT_ENV = "yes"

IMAGE_BOOT_FILES = " \
    ${KERNEL_IMAGETYPE} \
    extlinux.conf;extlinux/extlinux.conf \
"
MACHINE_ESSENTIAL_EXTRA_RDEPENDS:remove = "u-boot-extlinux kernel-image fitImage kernel-devicetree"