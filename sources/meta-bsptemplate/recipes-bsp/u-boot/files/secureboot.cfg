# Required for verifying the signed kernel fitImage
CONFIG_FIT_SIGNATURE=y
CONFIG_RSA=y
CONFIG_OF_CONTROL=y

# Boot paths that never check FIT signatures: EFI applications, legacy
# uImages, boot scripts, raw kernels (booti) and raw initrds.
# CONFIG_EFI_LOADER is not set
# CONFIG_LEGACY_IMAGE_FORMAT is not set
# CONFIG_BOOTMETH_SCRIPT is not set
# CONFIG_CMD_BOOTI is not set
# CONFIG_SUPPORT_RAW_INITRD is not set

# BOOTSTD_DEFAULTS force-selects the last three, so turn it off and keep the
# rest of what it enabled.
# CONFIG_BOOTSTD_DEFAULTS is not set
CONFIG_BOOTMETH_EXTLINUX=y
CONFIG_USE_BOOTCOMMAND=y
CONFIG_BOOTCOMMAND="bootflow scan -lb"
CONFIG_ENV_VARS_UBOOT_CONFIG=y
CONFIG_EFI_PARTITION=y
CONFIG_ISO_PARTITION=y
CONFIG_USB_STORAGE=y
CONFIG_CMD_ENV_EXISTS=y
CONFIG_CMD_EXT2=y
CONFIG_CMD_EXT4=y
CONFIG_CMD_FAT=y
CONFIG_CMD_FS_GENERIC=y
CONFIG_CMD_PART=y
