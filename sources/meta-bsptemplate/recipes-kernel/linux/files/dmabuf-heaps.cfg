# /dev/dma_heap/system, used by camera-service and preprocessing-service.
CONFIG_DMABUF_HEAPS=y
CONFIG_DMABUF_HEAPS_SYSTEM=y
# /dev/dma_heap/linux,cma: contiguous buffers the NPU can import directly.
# Area size/placement comes from the linux,cma node in radxa-zero-3w-npu.dtsi.
CONFIG_DMABUF_HEAPS_CMA=y
