# GPU on panfrost (open source DRM driver) instead of the Mali kbase drivers,
# Mesa panvk (preprocessing / overlay Vulkan compute) needs panfrost.
# Both drivers bind "arm,mali-bifrost", so the kbase ones must be off.
# CONFIG_MALI_BIFROST is not set
# CONFIG_MALI_MIDGARD is not set
# CONFIG_MALI400 is not set
CONFIG_DRM_PANFROST=m
