# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-distrotemplate"
BBFILE_PATTERN_meta-distrotemplate = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-distrotemplate = "6"

LAYERDEPENDS_meta-distrotemplate = "core"
LAYERSERIES_COMPAT_meta-distrotemplate = "scarthgap"