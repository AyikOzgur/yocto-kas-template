# Read by mavlink-routerd next to its command line (flight controller UART, TCP 5760 for
# ground stations on the IP network).
#
# MAVLink over WiFi broadcast (wfb-mavlink-down / -up.service). Each direction has its own
# process there: telemetry goes to wfb_tx, commands come from wfb_rx. The group makes the two
# endpoints one link for routing: a ground station heard on the uplink is reached through the
# downlink, and its own messages are not sent back to it.
[UdpEndpoint wfb_down]
Mode = Normal
Address = 127.0.0.1
Port = 5610
Group = wfb

[UdpEndpoint wfb_up]
Mode = Server
Address = 127.0.0.1
Port = 5611
Group = wfb
